# ProDraft — publicación automática
# • Cada cambio en "main" actualiza la app web (y la app de Android se actualiza sola, porque la carga desde ahí).
# • Al crear una etiqueta v1.0.0, v1.0.1… (o a mano desde Actions) se arma el APK y se publica en Releases.
name: Construir ProDraft

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      apk:
        description: 'Volver a armar el APK de Android'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write

jobs:
  # ---------- App web (lo que ve la tableta) ----------
  web:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar en GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="$(node -p "require('./package.json').version")-$(git rev-parse --short HEAD)"
          rm -rf site && cp -r web site
          sed -i "s/__PD_VERSION__/$V/g" site/index.html site/sw.js
          touch site/.nojekyll
          cd site && git init -q && git checkout -q -b gh-pages && git add -A
          git -c user.name="ProDraft" -c user.email="prodraft@users.noreply.github.com" commit -qm "ProDraft web $V"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
          # activa GitHub Pages la primera vez (si ya está activo no pasa nada)
          gh api -X POST "repos/${{ github.repository }}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" >/dev/null 2>&1 || true

  # ---------- Android (APK) ----------
  android:
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.apk) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar la app
        working-directory: movil
        run: |
          npm install
          rm -rf www android && mkdir www && cp -r ../web/* www/
          rm -f www/sw.js
          cp sin-conexion.html www/
          V=$(node -p "require('../package.json').version")
          sed -i "s/__PD_VERSION__/$V/g" www/index.html
          npx cap add android
          cp native/*.java android/app/src/main/java/com/arquizo/prodraft/
          cp -r res/* android/app/src/main/res/
          sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || true
          for f in $(find android/app/src/main/res -name 'splash.png'); do
            W=$(identify -format '%w' "$f" || echo 0); H=$(identify -format '%h' "$f" || echo 0); [ "$W" = 0 ] && continue; M=$(( W<H ? W : H )); L=$(( M*34/100 ))
            convert -size ${W}x${H} xc:'#0b0b0c' \( splash-logo.png -resize ${L}x${L} \) -gravity center -composite "$f" || echo "splash sin cambiar: $f"
          done
          CODE=$(node -p "const [a,b,c]=require('../package.json').version.split('.').map(Number);a*10000+b*100+c")
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          # la app gira libremente (tableta horizontal o vertical)
          npx cap sync android
      - name: Compilar
        working-directory: movil/android
        run: ./gradlew assembleRelease --no-daemon -q
      - name: Firmar y publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/zipalign -p -f 4 movil/android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks movil/prodraft.jks --ks-key-alias prodraft --ks-pass pass:prodraft-arquizo-2026 --key-pass pass:prodraft-arquizo-2026 --out ProDraft.apk aligned.apk
          $BT/apksigner verify ProDraft.apk && ls -la ProDraft.apk
          V=$(node -p "require('./package.json').version")
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "ProDraft $V" --notes "ProDraft $V — bocetos para arquitectos. Descarga ProDraft.apk e instálalo en tu tableta Android."
          gh release upload "v$V" ProDraft.apk --clobber
